name: Verify skipped tests on Windows

on:
  push:
    branches:
      - windows-test-skips
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skipped-tests:
    name: ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.0
            dbtype: mysql
            plugin: none
            expected: 6
    env:
      WP_VERSION: trunk
      WP_CLI_TEST_DBTYPE: ${{ matrix.dbtype }}
      NO_COLOR: '1'
      WP_CLI_TEST_QUIET: '1'
      COMPOSER_ROOT_VERSION: dev-main
      WP_CLI_TEST_DBROOTUSER: root
      WP_CLI_TEST_DBROOTPASS: root
      WP_CLI_TEST_DBNAME: wp_cli_test
      WP_CLI_TEST_DBUSER: wp_cli_test
      WP_CLI_TEST_DBPASS: password1
      WP_CLI_TEST_DBHOST: 127.0.0.1:3306
    steps:
      - name: Check out the test branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use the same temporary directory as upstream Windows CI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'D:\Temp' | Out-Null
          'TEMP=D:\Temp' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'TMP=D:\Temp' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install SQLite
        if: matrix.dbtype == 'sqlite'
        run: choco install sqlite --yes

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          ini-values: zend.assertions=1, error_reporting=-1, display_errors=On
          extensions: gd, imagick, mysql, zip, pdo_sqlite, exif, fileinfo
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up MySQL
        if: matrix.dbtype == 'mysql'
        uses: shogo82148/actions-setup-mysql@083ec148d28e62f2b24b8f4541693dfe1d50488d
        with:
          mysql-version: '8.0'
          auto-start: true
          root-password: root
          user: wp_cli_test
          password: password1
          my-cnf: |
            default_authentication_plugin=mysql_native_password

      - name: Prepare the MySQL test database
        if: matrix.dbtype == 'mysql'
        shell: bash
        run: composer prepare-tests

      - name: Check out the merged SQLite plugin
        if: matrix.plugin == 'merged'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: WordPress/sqlite-database-integration
          ref: 4163f69f3d543ec7d6085bbb0c4e0c36b36c0156
          path: sqlite-source
          persist-credentials: false

      - name: Preload the merged plugin into the test cache
        if: matrix.plugin == 'merged'
        shell: pwsh
        run: |
          $cacheRoot = Join-Path (php -r 'echo sys_get_temp_dir();') 'wp-cli-test-sqlite-integration-cache'
          $plugin = Join-Path $cacheRoot 'sqlite-database-integration'
          New-Item -ItemType Directory -Force -Path (Join-Path $plugin 'wp-includes') | Out-Null
          Get-ChildItem 'sqlite-source/packages/plugin-sqlite-database-integration' |
            Where-Object Name -NE 'wp-includes' |
            Copy-Item -Destination $plugin -Recurse
          Copy-Item 'sqlite-source/packages/plugin-sqlite-database-integration/wp-includes/sqlite' (Join-Path $plugin 'wp-includes/sqlite') -Recurse
          Copy-Item 'sqlite-source/packages/mysql-on-sqlite/src' (Join-Path $plugin 'wp-includes/database') -Recurse
          if (!(Test-Path (Join-Path $plugin 'db.copy'))) { throw 'Missing plugin drop-in template.' }
          if (!(Test-Path (Join-Path $plugin 'wp-includes/database/version.php'))) { throw 'Missing SQLite driver.' }
          Write-Host "Using merged SQLite plugin at $plugin"

      - name: Preload the published SQLite plugin into the test cache
        if: matrix.plugin == 'published'
        shell: pwsh
        run: |
          $cacheRoot = Join-Path (php -r 'echo sys_get_temp_dir();') 'wp-cli-test-sqlite-integration-cache'
          $archive = Join-Path $env:RUNNER_TEMP 'sqlite-plugin.zip'
          Invoke-WebRequest 'https://downloads.wordpress.org/plugin/sqlite-database-integration.3.0.2.zip' -OutFile $archive
          Expand-Archive $archive -DestinationPath $cacheRoot
          if (!(Test-Path (Join-Path $cacheRoot 'sqlite-database-integration/db.copy'))) { throw 'Missing plugin drop-in template.' }
          Write-Host 'Using published SQLite plugin 3.0.2'

      - name: Record the versions and test changes and verify production code is unchanged
        shell: bash
        run: |
          git fetch origin eb9ef6a83e7444501c920e177f7e547a3f08dc55 --depth=1
          git diff --exit-code eb9ef6a83e7444501c920e177f7e547a3f08dc55 -- src composer.json behat.yml
          git diff eb9ef6a83e7444501c920e177f7e547a3f08dc55 -- features
          php --version
          composer show wp-cli/wp-cli-tests
          if [ "$WP_CLI_TEST_DBTYPE" = sqlite ]; then
            sqlite3 --version
            php -r '$pdo = new PDO("sqlite::memory:"); echo "PDO SQLite: ", $pdo->query("SELECT sqlite_version()")->fetchColumn(), PHP_EOL; echo "PDO dbstat enabled: ", (int) in_array("ENABLE_DBSTAT_VTAB", $pdo->query("PRAGMA compile_options")->fetchAll(PDO::FETCH_COLUMN), true), PHP_EOL;'
          else
            mysql --version
          fi
          if [ -d sqlite-source ]; then
            git -C sqlite-source rev-parse HEAD
          fi

      - name: Trace MySQL subprocesses without changing their behavior
        shell: pwsh
        run: |
          $path = 'vendor/wp-cli/wp-cli/php/utils.php'
          $source = Get-Content $path -Raw
          $source = $source.Replace(
            "`t`$process = proc_open_compat( `$final_cmd, `$descriptors, `$pipes );",
            "`tfile_put_contents( 'D:/Temp/mysql-commands.log', `$final_cmd . PHP_EOL, FILE_APPEND );`n`t`$process = proc_open_compat( `$final_cmd, `$descriptors, `$pipes );"
          )
          $source = $source.Replace(
            "`t`$exit_code = proc_close( `$process );",
            "`t`$exit_code = proc_close( `$process );`n`tfile_put_contents( 'D:/Temp/mysql-commands.log', 'Exit: ' . `$exit_code . PHP_EOL, FILE_APPEND );"
          )
          Set-Content $path $source
          php -l $path

      - name: Run the formerly skipped scenarios together and separately
        shell: bash
        env:
          EXPECTED_SCENARIOS: ${{ matrix.expected }}
        run: |
          mkdir -p windows-logs
          failures=0
          for target in all features/db-export.feature:153 features/db-search.feature:986 features/db-size.feature:36 features/db-size.feature:86 features/db-size.feature:228 features/db-size.feature:289; do
            echo "::group::Windows run $target"
            args=()
            expected="$EXPECTED_SCENARIOS scenarios ($EXPECTED_SCENARIOS passed)"
            if [ "$target" != all ]; then
              args+=("$target")
              expected='1 scenario (1 passed)'
            fi
            log="windows-logs/${target//[\/:]/-}.log"
            set +e
            composer behat -- "${args[@]}" --tags=@windows-audit --format=pretty 2>&1 | tee "$log"
            result=${PIPESTATUS[0]}
            set -e
            if [ "$result" -ne 0 ] || ! grep -Fq "$expected" "$log"; then
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          test "$failures" -eq 0

      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-skip-logs-${{ matrix.dbtype }}-${{ matrix.plugin }}
          path: |
            windows-logs
            D:/Temp/mysql-commands.log
          if-no-files-found: warn
